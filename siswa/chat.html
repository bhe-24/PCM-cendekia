<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Admin - Cendekia Aksara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }

        /* Loader */
        .page-loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #005a9c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile Sidebar Overlay */
        #mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; display: none; }
        
        /* Sidebar Transition */
        aside { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            aside { position: fixed; inset-y: 0; left: 0; transform: translateX(-100%); z-index: 50; width: 80%; max-width: 300px; }
            aside.open { transform: translateX(0); }
        }

        /* CHAT BUBBLES */
        .chat-bg { background-image: url("https://www.transparenttextures.com/patterns/subtle-white-feathers.png"); background-color: #f1f5f9; }
        
        .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; position: relative; font-size: 0.95rem; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        /* Pesan SAYA (Siswa) -> Kanan, Biru */
        .bubble-me { background-color: #005a9c; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .bubble-me .meta { color: rgba(255,255,255,0.7); }

        /* Pesan ADMIN -> Kiri, Putih */
        .bubble-admin { background-color: white; color: #1e293b; margin-right: auto; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }
        .bubble-admin .meta { color: #94a3b8; }

        .meta { font-size: 0.7rem; margin-top: 4px; display: block; text-align: right; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <div id="loader" class="page-loader">
        <div class="spinner mb-4"></div>
        <p class="text-slate-500 font-medium text-sm animate-pulse">Menghubungkan ke Server Chat...</p>
    </div>

    <div id="mobile-overlay"></div>

    <aside id="sidebar" class="bg-white border-r border-slate-200 flex flex-col h-full md:w-64 md:transform-none flex-shrink-0">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-[#005a9c] text-white p-2 rounded-lg"><i class="fas fa-graduation-cap"></i></div>
                <h1 class="font-bold text-lg text-slate-800">Portal Siswa</h1>
            </div>
            <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="index.html" class="block px-4 py-3 rounded-lg flex items-center gap-3 text-slate-600 hover:bg-slate-50 hover:text-[#005a9c] transition font-medium">
                <i class="fas fa-home w-5 text-center"></i> Beranda
            </a>
            <a href="tugas.html" class="block px-4 py-3 rounded-lg flex items-center gap-3 text-slate-600 hover:bg-slate-50 hover:text-[#005a9c] transition font-medium">
                <i class="fas fa-clipboard-list w-5 text-center"></i> Tugas Saya
            </a>
            <a href="chat.html" class="block px-4 py-3 rounded-lg flex items-center gap-3 bg-blue-50 text-[#005a9c] font-bold">
                <i class="fas fa-comments w-5 text-center"></i> Chat Admin
            </a>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 mb-4 px-2">
                <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold" id="user-initial">?</div>
                <div class="overflow-hidden">
                    <p class="text-sm font-bold text-slate-800 truncate" id="sidebar-name">Memuat...</p>
                    <p class="text-xs text-slate-500 truncate">Siswa Aktif</p>
                </div>
            </div>
            <button id="logout-btn" class="w-full px-4 py-2 border border-red-200 text-red-600 rounded-lg hover:bg-red-50 text-sm font-medium transition flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Keluar
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative w-full bg-white">
        
        <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center z-20 flex-shrink-0 shadow-sm">
            <div class="flex items-center gap-4">
                <button id="open-sidebar" class="md:hidden text-slate-600 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#005a9c] flex items-center justify-center text-white border-2 border-slate-100 shadow-sm">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-sm md:text-base">Admin Cendekia</h2>
                        <div class="flex items-center gap-1.5">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                            <span class="text-xs text-slate-500">Online & Siap Membantu</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-bg scroll-smooth">
            <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-center opacity-60">
                <div class="w-20 h-20 bg-slate-200 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-comments text-3xl text-slate-400"></i>
                </div>
                <p class="text-sm font-medium text-slate-500">Belum ada percakapan.<br>Sapa admin untuk memulai!</p>
            </div>
        </div>

        <div class="p-4 border-t border-slate-200 bg-white flex-shrink-0">
            <form id="chat-form" class="max-w-4xl mx-auto flex items-end gap-3">
                <div class="flex-1 relative">
                    <textarea id="msg-input" rows="1" class="w-full pl-4 pr-4 py-3 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-[#005a9c] outline-none resize-none max-h-32 bg-slate-50 focus:bg-white transition" placeholder="Tulis pesan Anda..." required></textarea>
                </div>
                <button type="submit" class="w-12 h-12 bg-[#005a9c] text-white rounded-full hover:bg-[#004b80] transition shadow-lg flex items-center justify-center flex-shrink-0 group">
                    <i class="fas fa-paper-plane group-hover:scale-110 transition-transform"></i>
                </button>
            </form>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG (SAMA SEPERTI SEBELUMNYA)
        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676", storageBucket: "mading-cf676.appspot.com", messagingSenderId: "72175203671", appId: "1:72175203671:web:7a0676a55beb64bc96ba12" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;

        // 1. AUTH & INIT
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '../login.html';
            } else {
                currentUser = user;
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    userData = snap.data();
                    // Update Sidebar
                    document.getElementById('sidebar-name').textContent = userData.name;
                    document.getElementById('user-initial').textContent = userData.name.charAt(0).toUpperCase();
                    
                    // Hide Loader
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);

                    // Load Chat
                    loadChat(user.uid);
                }
            }
        });

        // 2. CHAT LOGIC (REALTIME)
        function loadChat(uid) {
            const container = document.getElementById('messages-container');
            const emptyState = document.getElementById('empty-state');
            
            // Query: Ambil pesan milik user ini, urutkan berdasarkan waktu
            const q = query(collection(db, "messages"), where("userId", "==", uid), orderBy("timestamp", "asc"));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                
                // Render Ulang (Sebenarnya bisa dioptimalkan dengan docChanges, tapi ini aman untuk pemula)
                // Kita gunakan trik sederhana: Bersihkan container, lalu render semua.
                container.innerHTML = ''; 
                container.appendChild(emptyState); // Keep empty state logic valid

                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isMe = msg.sender === 'student'; // Cek pengirim
                    const date = msg.timestamp ? msg.timestamp.toDate() : new Date();
                    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const div = document.createElement('div');
                    div.className = "flex w-full"; // Wrapper flex

                    const bubble = document.createElement('div');
                    bubble.className = `bubble ${isMe ? 'bubble-me' : 'bubble-admin'} animate-fade-in-up`;
                    bubble.innerHTML = `
                        <p>${msg.content}</p>
                        <span class="meta flex items-center gap-1 justify-end">
                            ${timeStr} 
                            ${isMe ? (msg.read ? '<i class="fas fa-check-double text-[10px] text-blue-200"></i>' : '<i class="fas fa-check text-[10px]"></i>') : ''}
                        </span>
                    `;

                    div.appendChild(bubble);
                    container.appendChild(div);
                });

                // Auto Scroll ke Bawah
                container.scrollTop = container.scrollHeight;
            });
        }

        // 3. SEND MESSAGE
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');

        // Auto resize textarea (UX)
        msgInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = 'auto';
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text) return;

            // Reset Input UI segera agar terasa cepat
            msgInput.value = '';
            msgInput.style.height = 'auto';
            msgInput.focus();

            try {
                await addDoc(collection(db, "messages"), {
                    content: text,
                    userId: currentUser.uid,
                    userName: userData.name,
                    sender: 'student', // Penanda pengirim
                    read: false, // Belum dibaca admin
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error("Gagal kirim pesan:", err);
                alert("Gagal mengirim pesan. Cek koneksi.");
            }
        });

        // Enter key to send (Shift+Enter for newline)
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // 4. SIDEBAR LOGIC (Copy-Paste)
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        openBtn.onclick = toggleSidebar;
        closeBtn.onclick = toggleSidebar;
        overlay.onclick = toggleSidebar;

        document.getElementById('logout-btn').onclick = () => signOut(auth);

    </script>
</body>
</html>
