<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penerimaan Cendekia Muda - Cendekia Aksara</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#001f3f', // Navy Utama
                            900: '#00152b',
                        },
                        mustard: {
                            400: '#FFDB58', // Mustard lembut
                            500: '#E1AD01', // Mustard kuat
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-navy-800 text-white shadow-lg border-b-4 border-mustard-500">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-mustard-400">PENERIMAAN CENDEKIA MUDA</h1>
                <p class="text-xs text-gray-300 tracking-widest uppercase">Portal Resmi Cendekia Aksara</p>
            </div>
            <img src="https://imgur.com/5Srjyo4.png" alt="Logo Cendekia Aksara" class="h-12 w-auto drop-shadow-md">
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 bg-[url('https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=1973&auto=format&fit=crop')] bg-cover bg-center relative">
        <div class="absolute inset-0 bg-navy-900 opacity-60"></div>

        <div class="relative w-full max-w-4xl bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
            
            <div class="hidden md:flex md:w-5/12 bg-navy-800 text-white p-8 flex-col justify-center items-center text-center">
                <div class="mb-6 bg-white p-4 rounded-full h-32 w-32 flex items-center justify-center shadow-lg">
                    <img src="https://imgur.com/5Srjyo4.png" alt="Logo" class="h-20">
                </div>
                <h2 class="text-xl font-bold mb-2">Selamat Datang</h2>
                <p class="text-sm text-gray-300 mb-6">Bergabunglah bersama kami untuk mencetak sejarah sastra baru.</p>
                <div class="border-t border-mustard-500 w-16 pt-4"></div>
            </div>

            <div class="w-full md:w-7/12 p-8 bg-glass">
                
                <div class="flex justify-center mb-8 border-b">
                    <button onclick="switchTab('login')" id="tab-login" class="w-1/2 pb-3 font-bold text-navy-800 border-b-4 border-navy-800 focus:outline-none transition">Masuk</button>
                    <button onclick="switchTab('register')" id="tab-register" class="w-1/2 pb-3 font-medium text-gray-500 hover:text-navy-800 focus:outline-none transition">Daftar Akun</button>
                </div>

                <form id="form-login" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-envelope"></i></span>
                            <input type="email" id="login-email" class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-mustard-400 focus:outline-none" placeholder="nama@email.com" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-lock"></i></span>
                            <input type="password" id="login-password" class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-mustard-400 focus:outline-none" placeholder="******" required>
                        </div>
                        <div class="text-right mt-1">
                            <a href="#" onclick="forgotPassword()" class="text-xs text-navy-800 hover:text-mustard-500 font-semibold">Lupa Password?</a>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-navy-800 text-white py-3 rounded-lg font-bold hover:bg-navy-900 transition shadow-lg flex justify-center items-center gap-2">
                        <span>MASUK SEKARANG</span> <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <form id="form-register" class="space-y-4 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Nama Lengkap</label>
                            <input type="text" id="reg-nama" class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-mustard-400 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Tanggal Lahir</label>
                            <input type="date" id="reg-tgl-lahir" class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-mustard-400 outline-none" required>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Alamat Lengkap</label>
                        <textarea id="reg-alamat" rows="2" class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-mustard-400 outline-none" required></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">No. Telepon/WA</label>
                            <input type="tel" id="reg-telp" class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-mustard-400 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Email</label>
                            <input type="email" id="reg-email" class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-mustard-400 outline-none" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
                        <input type="password" id="reg-password" class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-mustard-400 outline-none" placeholder="Minimal 6 karakter" required>
                    </div>

                    <button type="submit" class="w-full bg-mustard-500 text-navy-900 py-3 rounded-lg font-bold hover:bg-mustard-400 transition shadow-lg">
                        DAFTAR AKUN BARU
                    </button>
                </form>

            </div>
        </div>
    </main>

    <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500">
        <p>&copy; 2024 Cendekia Aksara. Hak Cipta Dilindungi.</p>
        <div class="mt-2 space-x-4">
            <a href="privacy.html" class="hover:text-navy-800 underline">Kebijakan Privasi</a>
            <a href="#" class="hover:text-navy-800 underline">Syarat & Ketentuan</a>
        </div>
    </footer>

    <script type="module">
        // Import Firebase dari CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-app.js";
        // TAMBAHAN: updateProfile WAJIB ADA di sini
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-analytics.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12",
            measurementId: "G-590P9LLK7J"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        // --- GLOBAL FUNCTIONS (Exposed to Window) ---
        
        // 1. Logic Switch Tab (Login <-> Register)
        window.switchTab = function(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                
                loginTab.classList.add('text-navy-800', 'border-navy-800', 'border-b-4');
                loginTab.classList.remove('text-gray-500');
                
                regTab.classList.remove('text-navy-800', 'border-navy-800', 'border-b-4');
                regTab.classList.add('text-gray-500');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                
                regTab.classList.add('text-navy-800', 'border-navy-800', 'border-b-4');
                regTab.classList.remove('text-gray-500');
                
                loginTab.classList.remove('text-navy-800', 'border-navy-800', 'border-b-4');
                loginTab.classList.add('text-gray-500');
            }
        }

        // 2. Logic Lupa Password
        window.forgotPassword = async function() {
            const { value: email } = await Swal.fire({
                title: 'Lupa Password?',
                text: 'Masukkan alamat email yang terdaftar. Kami akan mengirimkan link reset password.',
                input: 'email',
                inputPlaceholder: 'nama@email.com',
                showCancelButton: true,
                confirmButtonText: 'Kirim Link',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#001f3f',
                cancelButtonColor: '#d33',
                customClass: {
                    popup: 'rounded-xl'
                }
            });

            if (email) {
                Swal.fire({
                    title: 'Mengirim...',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading() }
                });

                sendPasswordResetEmail(auth, email)
                    .then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Email Terkirim!',
                            text: `Silakan cek kotak masuk atau folder spam di ${email} untuk mereset password Anda.`,
                            confirmButtonColor: '#001f3f'
                        });
                    })
                    .catch((error) => {
                        Swal.fire({
                            icon: 'error',
                            title: 'Gagal Mengirim',
                            text: error.message,
                            confirmButtonColor: '#d33'
                        });
                    });
            }
        }

        // 3. Logic Register (Daftar Akun) - REVISI PENTING DI SINI
        document.getElementById('form-register').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('reg-nama').value;
            const tglLahirVal = document.getElementById('reg-tgl-lahir').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            // -- LOGIKA CEK UMUR --
            const tglLahir = new Date(tglLahirVal);
            const today = new Date();
            let age = today.getFullYear() - tglLahir.getFullYear();
            const m = today.getMonth() - tglLahir.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < tglLahir.getDate())) {
                age--;
            }

            // Jika umur < 15 tahun
            if (age < 15) {
                // Hitung sisa waktu
                const targetDate = new Date(tglLahir);
                targetDate.setFullYear(tglLahir.getFullYear() + 15);
                
                const diffTime = Math.abs(targetDate - today);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                
                const yearsLeft = Math.floor(diffDays / 365);
                const monthsLeft = Math.floor((diffDays % 365) / 30);
                const daysLeft = Math.floor((diffDays % 365) % 30);

                Swal.fire({
                    icon: 'warning',
                    title: 'Mohon Maaf 🙏',
                    html: `
                        Anda belum memenuhi syarat usia minimal (15 Tahun).<br><br>
                        Silakan kembali lagi dalam waktu:<br>
                        <b>${yearsLeft} Tahun, ${monthsLeft} Bulan, ${daysLeft} Hari</b>.
                    `,
                    confirmButtonText: 'Saya Mengerti',
                    confirmButtonColor: '#E1AD01' 
                });
                return; // Stop proses
            }

            // Jika Lolos Umur -> Loading
            Swal.fire({
                title: 'Mendaftarkan Akun...',
                html: 'Mohon tunggu sebentar, sistem sedang memproses data Anda.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            // Proses Firebase Auth
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    // === PERBAIKAN PENTING: UPDATE DISPLAY NAME ===
                    // Ini yang membuat nama langsung muncul di Dashboard
                    return updateProfile(user, {
                        displayName: nama,
                        photoURL: "https://i.ibb.co/tMdJD76/default-avatar.png" // Foto Default
                    });
                })
                .then(() => {
                    // Jika Update Profile Sukses, Baru Tampilkan Alert Sukses
                    Swal.fire({
                        icon: 'success',
                        title: 'Pendaftaran Berhasil!',
                        text: 'Akun Anda telah dibuat dengan nama: ' + nama,
                        confirmButtonText: 'Masuk Dashboard',
                        confirmButtonColor: '#001f3f'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Langsung Login otomatis atau arahkan ke login tab
                            document.getElementById('form-register').reset();
                            switchTab('login');
                        }
                    });
                })
                .catch((error) => {
                    const errorCode = error.code;
                    let errorMessage = error.message;
                    
                    if (errorCode === 'auth/email-already-in-use') {
                        errorMessage = "Email ini sudah terdaftar sebelumnya.";
                    }

                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal Mendaftar',
                        text: errorMessage,
                        confirmButtonColor: '#d33'
                    });
                });
        });

        // 4. Logic Login (Masuk)
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            Swal.fire({
                title: 'Sedang Masuk...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in 
                    const user = userCredential.user;
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil!',
                        text: `Selamat datang kembali, ${user.displayName || 'Siswa'}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        // Cek Domain Admin
                        if (email.includes('@ac.id')) {
                            window.location.href = "admin/index.html";
                        } else {
                            window.location.href = "dashboard/index.html";
                        }
                    });
                })
                .catch((error) => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal Masuk',
                        text: 'Email atau password salah. Silakan coba lagi.',
                        confirmButtonColor: '#d33'
                    });
                });
        });

    </script>
</body>
</html>
