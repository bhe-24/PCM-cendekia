<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Alumni - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex font-sans">

    <aside class="w-64 bg-gray-900 text-white flex flex-col fixed h-full hidden md:flex">
        <div class="p-6 font-bold text-xl text-yellow-400">ADMIN PANEL</div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="index.html" class="block px-4 py-2 hover:bg-gray-800 rounded">Dashboard Utama</a>
            <a href="#" class="block px-4 py-2 bg-gray-800 rounded text-yellow-400 font-bold">Kelola Alumni</a>
        </nav>
    </aside>

    <main class="flex-grow md:ml-64 p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Kelola Testimoni Alumni</h1>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">Tambah Alumni Baru</h2>
            <form id="form-alumni" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-sm font-bold mb-1">Nama Alumni</label>
                    <input type="text" id="nama" class="w-full border p-2 rounded" required>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">Rating (Bintang)</label>
                    <select id="rating" class="w-full border p-2 rounded">
                        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4">⭐⭐⭐⭐ (4)</option>
                        <option value="3">⭐⭐⭐ (3)</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-bold mb-1">Pesan / Testimoni</label>
                    <textarea id="pesan" class="w-full border p-2 rounded h-20" placeholder="Apa kata mereka tentang Cendekia Aksara?" required></textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-bold mb-1">Foto Alumni</label>
                    <input type="file" id="foto" class="w-full border p-2 rounded" accept="image/*" required>
                    <p class="text-xs text-gray-500 mt-1">Otomatis upload ke ImgBB</p>
                </div>

                <div class="md:col-span-2">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 w-full">
                        <i class="fas fa-plus mr-2"></i> Tambahkan ke Slideshow
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-bold mb-4">Daftar Alumni Aktif</h2>
            <div id="list-alumni" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-gray-500 col-span-3 text-center">Memuat data...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12",
            measurementId: "G-590P9LLK7J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. TAMBAH ALUMNI
        document.getElementById('form-alumni').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const pesan = document.getElementById('pesan').value;
            const rating = parseInt(document.getElementById('rating').value);
            const fileInput = document.getElementById('foto');
            const file = fileInput.files[0];

            if (!file) return;

            Swal.fire({title: 'Mengupload...', didOpen: () => Swal.showLoading()});

            // Upload ImgBB
            const formData = new FormData();
            formData.append("image", file);

            try {
                const res = await fetch("https://api.imgbb.com/1/upload?key=2f45fcafb6dfb2dbae295499022ce476", {
                    method: "POST", body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    // Simpan ke Firestore
                    await addDoc(collection(db, "alumni_testimonials"), {
                        nama: nama,
                        pesan: pesan,
                        rating: rating,
                        foto: data.data.url,
                        createdAt: new Date().toISOString()
                    });

                    Swal.fire('Berhasil', 'Alumni ditambahkan!', 'success');
                    document.getElementById('form-alumni').reset();
                }
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        });

        // 2. LIHAT & HAPUS
        const q = query(collection(db, "alumni_testimonials"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('list-alumni');
            container.innerHTML = "";

            if(snapshot.empty) {
                container.innerHTML = `<p class="text-gray-500 col-span-3 text-center">Belum ada data.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const d = docSnap.data();
                const item = document.createElement('div');
                item.className = "border rounded-lg p-4 flex items-start gap-3 bg-gray-50 relative group";
                item.innerHTML = `
                    <img src="${d.foto}" class="w-12 h-12 rounded-full object-cover">
                    <div>
                        <p class="font-bold text-sm">${d.nama}</p>
                        <p class="text-yellow-500 text-xs">${'★'.repeat(d.rating)}</p>
                        <p class="text-xs text-gray-600 mt-1 italic line-clamp-2">"${d.pesan}"</p>
                    </div>
                    <button onclick="hapus('${docSnap.id}')" class="absolute top-2 right-2 text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                container.appendChild(item);
            });
        });

        window.hapus = async function(id) {
            if(confirm("Hapus alumni ini?")) {
                await deleteDoc(doc(db, "alumni_testimonials", id));
            }
        }
    </script>
</body>
</html>
