<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Portal - Cendekia Aksara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        
        /* Notifikasi Toast */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 300px; padding: 16px; border-radius: 12px; background: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-left: 5px solid; animation: slideIn 0.3s ease-out; }
        .toast-success { border-color: #10b981; } .toast-error { border-color: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Spinner */
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden-section { display: none; }
        .active-section { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div id="toast-container"></div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <div class="p-6 text-center bg-white border-b border-slate-100">
            <a href="index.html" class="inline-flex items-center gap-2 text-[#005a9c] hover:text-[#004b80] mb-4 text-sm font-semibold">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
            <div class="w-12 h-12 bg-[#005a9c] text-white rounded-lg flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fas fa-feather-alt"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Portal Akademik</h2>
            <p class="text-slate-500 text-sm">Masuk untuk mengakses materi & kelas.</p>
        </div>

        <div class="flex p-2 m-4 bg-slate-100 rounded-lg">
            <button id="tab-login" class="flex-1 py-2 text-sm font-bold rounded-md bg-white text-[#005a9c] shadow-sm transition">Masuk</button>
            <button id="tab-register" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition">Daftar Baru</button>
        </div>

        <div id="view-login" class="p-6 pt-0 active-section">
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005a9c] outline-none" placeholder="nama@email.com">
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="block text-xs font-bold text-slate-600 uppercase">Password</label>
                        <a href="#" class="text-xs text-[#005a9c] hover:underline">Lupa Password?</a>
                    </div>
                    <input type="password" id="login-password" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005a9c] outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-[#005a9c] text-white font-bold py-3 rounded-lg hover:bg-[#004b80] transition flex justify-center items-center gap-2">
                    <span>Masuk Portal</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </div>

        <div id="view-register" class="p-6 pt-0 hidden-section">
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-name" required class="w-full p-3 border border-slate-300 rounded-lg outline-none" placeholder="Sesuai KTP/Identitas">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="reg-email" required class="w-full p-3 border border-slate-300 rounded-lg outline-none" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="reg-phone" required class="w-full p-3 border border-slate-300 rounded-lg outline-none" placeholder="0812...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="reg-password" required minlength="6" class="w-full p-3 border border-slate-300 rounded-lg outline-none" placeholder="Min. 6 karakter">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition flex justify-center items-center gap-2">
                    <span>Buat Akun Siswa</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </div>
    </div>

   <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Ganti config ini jika berbeda, tapi karena satu project, harusnya sama
        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676", storageBucket: "mading-cf676.appspot.com", messagingSenderId: "72175203671", appId: "1:72175203671:web:7a0676a55beb64bc96ba12" };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- TAB SWITCHER LOGIC (SAMA SEPERTI SEBELUMNYA) ---
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const viewLogin = document.getElementById('view-login');
        const viewRegister = document.getElementById('view-register');

        function switchTab(target) {
            if (target === 'register') {
                viewLogin.classList.add('hidden-section'); viewLogin.classList.remove('active-section');
                viewRegister.classList.remove('hidden-section'); viewRegister.classList.add('active-section');
                tabRegister.classList.add('bg-white', 'text-[#005a9c]', 'shadow-sm'); tabRegister.classList.remove('text-slate-500');
                tabLogin.classList.remove('bg-white', 'text-[#005a9c]', 'shadow-sm'); tabLogin.classList.add('text-slate-500');
            } else {
                viewRegister.classList.add('hidden-section'); viewRegister.classList.remove('active-section');
                viewLogin.classList.remove('hidden-section'); viewLogin.classList.add('active-section');
                tabLogin.classList.add('bg-white', 'text-[#005a9c]', 'shadow-sm'); tabLogin.classList.remove('text-slate-500');
                tabRegister.classList.remove('bg-white', 'text-[#005a9c]', 'shadow-sm'); tabRegister.classList.add('text-slate-500');
            }
        }

        tabLogin.onclick = () => switchTab('login');
        tabRegister.onclick = () => switchTab('register');
        if (mode === 'register') switchTab('register');

        // --- TOAST FUNCTION ---
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const div = document.createElement('div');
            div.className = `toast ${type === 'error' ? 'toast-error' : 'toast-success'}`;
            div.innerHTML = `<div class="font-bold text-slate-800">${type === 'error' ? 'Gagal' : 'Berhasil'}</div><div class="text-sm text-slate-600">${msg}</div>`;
            container.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        // --- LOGIN LOGIC (PERBAIKAN REDIRECT) ---
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const spin = btn.querySelector('.spinner');
            btn.disabled = true; spin.classList.remove('hidden');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                
                // Cek Role di Database
                const docRef = doc(db, "users", cred.user.uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    const role = userData.role;

                    // VALIDASI GANDA: Jika email @ac.id tapi di database masih 'siswa' (karena salah daftar sebelumnya),
                    // Kita perbaiki datanya sekarang juga secara otomatis.
                    if (email.endsWith('@ac.id') && role !== 'admin') {
                        // Perbaiki Role di Database
                        await setDoc(docRef, { role: 'admin' }, { merge: true });
                        showToast(`Role diperbarui ke Admin. Mengalihkan...`);
                        setTimeout(() => window.location.href = `admin/index.html`, 1500);
                    } else {
                        showToast(`Login sukses! Masuk sebagai ${role}...`);
                        setTimeout(() => window.location.href = `${role}/index.html`, 1500);
                    }

                } else {
                    // Jika user ada di Auth tapi tidak ada di Firestore (Mungkin dari aplikasi lain)
                    // Kita buatkan data profil baru berdasarkan emailnya
                    const autoRole = email.endsWith('@ac.id') ? 'admin' : 'siswa';
                    
                    await setDoc(docRef, {
                        email: email,
                        role: autoRole,
                        createdAt: serverTimestamp()
                    }, { merge: true });

                    showToast(`Profil baru dibuat. Mengalihkan ke ${autoRole}...`);
                    setTimeout(() => window.location.href = `${autoRole}/index.html`, 1500);
                }
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if(error.code === 'auth/invalid-credential') msg = "Email atau password salah.";
                showToast(msg, 'error');
                btn.disabled = false; spin.classList.add('hidden');
            }
        };

        // --- REGISTER LOGIC (PERBAIKAN ROLE OTOMATIS) ---
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const spin = btn.querySelector('.spinner');
            btn.disabled = true; spin.classList.remove('hidden');

            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;

            // LOGIKA PENENTUAN ROLE
            // Jika email berakhiran @ac.id, maka role = admin
            // Selain itu, role = siswa
            const determinedRole = email.endsWith('@ac.id') ? 'admin' : 'siswa';

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                
                // Simpan Data dengan Role yang Benar
                await setDoc(doc(db, "users", cred.user.uid), {
                    name: name,
                    email: email,
                    phone: phone,
                    role: determinedRole, // <--- INI KUNCINYA
                    currentStage: determinedRole === 'siswa' ? 'Pendaftaran Awal' : null, // Admin tidak butuh stage
                    createdAt: serverTimestamp(),
                    isRejected: false,
                    isArchived: false
                });

                showToast(`Akun ${determinedRole} berhasil dibuat! Mengalihkan...`);
                setTimeout(() => window.location.href = `${determinedRole}/index.html`, 1500);
                
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if(error.code === 'auth/email-already-in-use') msg = "Email sudah terdaftar. Silakan login.";
                showToast(msg, 'error');
                btn.disabled = false; spin.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
